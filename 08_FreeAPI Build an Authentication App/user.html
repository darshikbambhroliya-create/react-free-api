<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        width: 320px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h2 {
        margin-bottom: 20px;
      }

      p {
        margin: 10px 0;
        font-size: 16px;
      }

      .btn {
        margin-top: 20px;
        padding: 10px;
        width: 100%;
        border: none;
        background: #667eea;
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }

      .btn:hover {
        background: #5a67d8;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>User Profile</h2>

      <p><strong>Username:</strong> <span id="username">Loading...</span></p>
      <p><strong>Email:</strong> <span id="email">Loading...</span></p>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
    <script src="user.js"></script>
  </body>
</html>
