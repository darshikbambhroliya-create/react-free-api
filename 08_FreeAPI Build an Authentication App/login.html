<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .input-group {
        margin-bottom: 15px;
      }

      .input-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }

      .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
      }

      .input-group input:focus {
        border-color: #667eea;
      }

      .error {
        color: red;
        font-size: 12px;
        margin-top: 3px;
      }

      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        background: #667eea;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
      }

      .btn:hover {
        background: #5a67d8;
      }

      .footer {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }

      .footer a {
        color: #667eea;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Login</h2>

      <form id="loginForm">
        <div class="input-group">
          <label>username</label>
          <input type="text" id="username" required />
          <div class="error" id="usernameError"></div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required />
          <div class="error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>

      <div class="footer">
        Don’t have an account? <a href="register.html">Register</a>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
